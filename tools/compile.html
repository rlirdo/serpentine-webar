<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>MindAR 目標編譯（工具頁）</title>
<style>
  body { font: 16px "Microsoft JhengHei", sans-serif; background:#0b1f3a; color:#fff; padding:24px; }
  #credit { position:fixed; right:8px; bottom:8px; z-index:2147483647; font-size:13px; background:rgba(0,0,0,.55); padding:4px 10px; border-radius:8px; }
</style>
</head>
<body>
<h1>MindAR 目標編譯</h1>
<p id="msg">準備中…</p>
<div id="credit">NDHU自資系游豐兆製作</div>
<script type="module">
import { Compiler } from "../vendor/mindar/mindar-image.prod.js";
const msg = document.getElementById("msg");
const report = (o) => fetch("/__report", { method: "POST", body: JSON.stringify(o) });
try {
  const img = new Image();
  img.src = "../assets/target.png";
  await img.decode();
  const compiler = new Compiler();
  const t0 = performance.now();
  let last = -10;
  await compiler.compileImageTargets([img], (p) => {
    msg.textContent = "編譯中 " + p.toFixed(1) + "%";
    if (p - last >= 10) { last = p; report({ event: "progress", p }); }
  });
  const buf = await compiler.exportData();
  await fetch("/__save?path=assets/targets.mind", { method: "POST", body: buf });
  const secs = ((performance.now() - t0) / 1000).toFixed(1);
  msg.textContent = "完成：" + buf.byteLength + " bytes，" + secs + " 秒";
  await report({ event: "done", bytes: buf.byteLength, seconds: Number(secs), width: img.naturalWidth, height: img.naturalHeight });
} catch (e) {
  msg.textContent = "錯誤：" + e;
  report({ event: "error", message: String(e && e.stack || e) });
}
</script>
</body>
</html>
